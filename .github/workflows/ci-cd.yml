name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: 'latest'

jobs:
  # 代码质量检查
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          cd apps/frontend && pnpm run lint:check
          cd ../ai-service && pnpm run lint

      - name: Run TypeScript checks
        run: |
          cd apps/frontend && pnpm run type-check

      - name: Check for security vulnerabilities
        run: pnpm audit --audit-level moderate

  # 前端测试
  frontend-tests:
    name: Frontend Tests
    needs: quality-check
    uses: ./.github/workflows/frontend-tests.yml

  # AI服务测试
  ai-service-tests:
    name: AI Service Tests
    needs: quality-check
    uses: ./.github/workflows/ai-service-tests.yml

  # 集成测试
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, ai-service-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      redis:
        image: redis:6-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start AI Service
        run: |
          cd apps/ai-service
          pnpm run start:test &
          sleep 10

      - name: Start Frontend
        run: |
          cd apps/frontend
          pnpm run build
          pnpm run preview &
          sleep 5

      - name: Run integration tests
        run: |
          cd apps/frontend
          pnpm run test:e2e:ci
        env:
          CI: true

  # 构建和部署
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [frontend-tests, ai-service-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: |
          cd apps/frontend
          pnpm run build

      - name: Build AI Service
        run: |
          cd apps/ai-service
          pnpm run build

      - name: Create deployment package
        run: |
          mkdir -p deployment-package
          cp -r apps/frontend/dist deployment-package/frontend
          cp -r apps/ai-service/dist deployment-package/ai-service
          cp -r apps/ai-service/package.json deployment-package/
          cp -r apps/ai-service/pnpm-lock.yaml deployment-package/

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deployment-package/

      # 部署到测试环境
      - name: Deploy to Staging
        if: success()
        run: |
          echo "Deploying to staging environment..."
          # 这里添加实际的部署脚本
          # 例如: 部署到 Docker, Kubernetes, 或云服务

  # 性能测试
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Download deployment artifacts
        uses: actions/download-artifact@v3
        with:
          name: deployment-package

      - name: Start test server
        run: |
          cd frontend
          npx serve -s . -l 3000 &
          sleep 5

      - name: Run Lighthouse performance tests
        run: |
          lhci autorun --upload.target=temporary-public-storage
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # 通知和报告
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [build-and-deploy, performance-tests]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## 部署结果摘要 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "✅ 构建和部署成功" >> $GITHUB_STEP_SUMMARY
            echo "📦 部署包已上传到 Artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 构建和部署失败" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 性能测试 ⚡" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.performance-tests.result }}" == "success" ]; then
            echo "✅ 性能测试通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 性能测试失败或跳过" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 环境信息 🌍" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js版本: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- 包管理器: pnpm ${{ env.PNPM_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- 构建时间: $(date)" >> $GITHUB_STEP_SUMMARY

      # 发送Slack通知（可选）
      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}