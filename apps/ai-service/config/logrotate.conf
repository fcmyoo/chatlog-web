# AI服务日志轮转配置
# 使用方法: logrotate -f /path/to/this/config

/mnt/e/code/GitHub/chatlog-web/apps/ai-service/logs/*.log {
    # 每日轮转
    daily
    
    # 保留30天的日志
    rotate 30
    
    # 日志文件超过10MB时轮转
    size 10M
    
    # 压缩旧日志文件
    compress
    delaycompress
    
    # 如果日志文件不存在，不报错
    missingok
    
    # 不轮转空文件
    notifempty
    
    # 创建新的日志文件
    create 644 root root
    
    # 日志轮转后的文件名格式
    dateext
    dateformat -%Y%m%d
    
    # 轮转后执行的命令（可选：重启服务以重新打开日志文件）
    postrotate
        # 如果使用PM2或其他进程管理器，可以发送信号重新打开日志文件
        # pm2 reload chatlog-ai-service 2>/dev/null || true
        # 或者使用kill -USR1 发送信号
        # pkill -USR1 -f "node.*app.js" 2>/dev/null || true
    endscript
}